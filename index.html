<!DOCTYPE html>

<!-- Define que o documento utiliza HTML5 -->
<html lang="pt-BR">

<head>

    <!-- Define a codificação de caracteres como UTF-8 -->
    <meta charset="UTF-8">

    <!-- Faz a página se adaptar a diferentes tamanhos de tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Importa o arquivo CSS responsável pela aparência da página -->
    <link rel="stylesheet" href="CSS/style.CSS">

    <!-- Importa o arquivo Json responsável por organizar e transportar os dados recebidos da API-->
    <link rel="manifest" href="manisfest.json">

    <!-- Define o título que aparece na aba do navegador -->
    <title>Meu Disney</title>

</head>

<body>

    <!-- Cabeçalho da aplicação -->
    <header>

        <!-- Título principal da página -->
        <h1>Meu Disney</h1>

        <!--
            Exibe a quantidade de personagens carregados.
            Esse texto será atualizado pelo JavaScript.
        -->
        <p id="mensagem">50 personagens carregados</p>

    </header>


    <!-- Conteúdo principal da aplicação -->
    <main>

        <!--
            Área onde os cards dos personagens serão inseridos.
            O JavaScript utiliza esse elemento para adicionar
            dinamicamente os personagens recebidos da API.
        -->
        <div id="resultado" class="cards-container"></div>


        <!-- Área responsável pelos controles da paginação -->
        <section class="controles">

            <!--
                Botão utilizado para carregar mais personagens.
                O JavaScript adiciona um evento de clique nesse botão.
            -->
            <button id="botaoCarregar">
                Carregar mais 50
            </button>

            <!--
                Exibe o número da página atual.
                Esse valor será atualizado pelo JavaScript.
            -->
            <p id="pagina">Página 1</p>

        </section>

    </main>


    <!--
        Importa o arquivo JavaScript.
        É nele que ficam as funções responsáveis por
        buscar os personagens na API e criar os cards.
    -->
    <script src="JS/script.JS"></script>

</body>

</html>
